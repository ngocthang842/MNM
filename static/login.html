<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập · Điểm danh khuôn mặt</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1d2330;--mut:#667085;--bd:#dfe3ea;--pri:#2457d6;--bad:#c62828;color-scheme:light}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#12151c;--card:#1b2030;--tx:#e8ebf2;--mut:#98a2b3;--bd:#2c3347;--pri:#6b93ff;--bad:#ff7b72}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
.box{width:100%;max-width:360px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:22px}
h1{font-size:18px;margin:0 0 4px}
.tag{font-size:12px;color:var(--mut)}
label{display:block;margin:14px 0 4px;font-size:12px;color:var(--mut);font-weight:600}
input{width:100%;padding:10px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}
button{width:100%;margin-top:18px;background:var(--pri);color:#fff;border:0;border-radius:6px;padding:11px;font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.5}
#err{color:var(--bad);margin-top:10px;min-height:18px}
</style>
</head>
<body>
<form class="box" onsubmit="go(event)">
  <h1>Điểm danh khuôn mặt</h1>
  <div class="tag">Đăng nhập để tiếp tục</div>
  <label for="u">Tài khoản (sinh viên: MSSV)</label>
  <input id="u" autocomplete="username" autofocus required>
  <label for="p">Mật khẩu</label>
  <input id="p" type="password" autocomplete="current-password" required>
  <button id="b">Đăng nhập</button>
  <div id="err"></div>
  <div class="tag">Sinh viên đăng nhập lần đầu: mật khẩu mặc định là MSSV của bạn. Sau khi vào, hãy đổi mật khẩu.</div>
</form>
<script>
async function go(e){
  e.preventDefault();
  const b = document.getElementById("b"), err = document.getElementById("err");
  b.disabled = true; err.textContent = "";
  try{
    const r = await fetch("/api/auth/login", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({username: document.getElementById("u").value, password: document.getElementById("p").value})});
    const j = await r.json().catch(() => ({}));
    if(!r.ok) throw new Error(j.detail || r.statusText);
    location.href = j.role === "teacher" ? "/teacher" : "/student";
  }catch(ex){ err.textContent = ex.message; b.disabled = false; }
}
</script>
</body>
</html>
